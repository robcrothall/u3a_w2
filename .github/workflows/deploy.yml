name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # public/ contents -> public_html/ (the web-served folder)
      - name: Deploy public/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./public_html/
          state-name: .ftp-deploy-sync-state-public.json
          exclude: |
            **/uploads/**
            **/.git*

      # app/ -> app/ (outside public_html - not web-accessible)
      - name: Deploy app/ to home directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: ./app/
          state-name: .ftp-deploy-sync-state-app.json

      # sql/ -> sql/ (migrations kept for reference/manual application)
      - name: Deploy sql/ to home directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./sql/
          server-dir: ./sql/
          state-name: .ftp-deploy-sync-state-sql.json
